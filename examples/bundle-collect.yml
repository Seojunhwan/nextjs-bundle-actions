name: Next.js Bundle Snapshot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      bundle-artifact-name: ${{ steps.bundle.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the commit that the snapshot identity represents.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - id: bundle
        uses: Seojunhwan/nextjs-bundle-actions/actions/collect@v1
        with:
          build-path: .next
          project-id: web

      - name: Use snapshot in the same job
        env:
          SNAPSHOT_PATH: ${{ steps.bundle.outputs.snapshot-path }}
        run: jq '.environment' "$SNAPSHOT_PATH"

  consume:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.collect.outputs.bundle-artifact-name }}
          path: bundle-snapshot

      - name: Use snapshot in a later job
        run: jq '.routes' bundle-snapshot/snapshot.json
